<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>SOGN SAFE / App Icon Master</title>

  <defs>
    <!-- ============ BACKGROUND ============ -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141B20"/>
      <stop offset="0.5" stop-color="#0B1013"/>
      <stop offset="1" stop-color="#080C0E"/>
    </linearGradient>

    <!-- ============ METALLIC FACES ============ -->
    <!-- Left face: brightest toward upper-right (centre), darkest at outer bottom-left -->
    <linearGradient id="metalLeft" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F7F4"/>
      <stop offset="0.34" stop-color="#D6DADD"/>
      <stop offset="0.68" stop-color="#9AA1A5"/>
      <stop offset="1" stop-color="#61686C"/>
    </linearGradient>

    <!-- Right face: same family but darker overall (light comes from upper-left) -->
    <linearGradient id="metalRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9EBEA"/>
      <stop offset="0.34" stop-color="#C1C6C8"/>
      <stop offset="0.68" stop-color="#8B9296"/>
      <stop offset="1" stop-color="#51585C"/>
    </linearGradient>

    <!-- Lower bevel facets -->
    <linearGradient id="bevelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343A3D"/>
      <stop offset="1" stop-color="#171C1F"/>
    </linearGradient>

    <!-- ============ WAVE / NAVIGATION METAL ============ -->
    <!-- Satin band: bright just left of centre, falling off to the right -->
    <linearGradient id="waveMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A9195"/>
      <stop offset="0.18" stop-color="#DDE1E1"/>
      <stop offset="0.42" stop-color="#FAFAF8"/>
      <stop offset="0.62" stop-color="#CBD1D3"/>
      <stop offset="1" stop-color="#6E757A"/>
    </linearGradient>

    <!-- ============ DIRECTION MARK ============ -->
    <linearGradient id="diamondMetal" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F2F3F1"/>
      <stop offset="0.4" stop-color="#C8CDCF"/>
      <stop offset="0.75" stop-color="#8E9599"/>
      <stop offset="1" stop-color="#5A6165"/>
    </linearGradient>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <g id="Background">
    <rect width="1024" height="1024" rx="195" fill="url(#bgGrad)"/>
  </g>

  <!-- ================= SYMBOL ================= -->
  <g id="Symbol">

    <!-- SHIP BOW -->
    <g id="Ship">
      <!-- Centre seam (drawn first, panels overlap its edges) -->
      <path id="Center Seam" d="M507 175 H517 V430 H507 Z" fill="#0D1114"/>

      <!-- Left panel -->
      <path id="Ship Left" d="M507 175 L196 240 L196 467 L507 430 Z" fill="url(#metalLeft)"/>
      <!-- Right panel (mirrored geometry) -->
      <path id="Ship Right" d="M517 175 L828 240 L828 467 L517 430 Z" fill="url(#metalRight)"/>

      <!-- Lower bevel facets -->
      <path id="Left Bevel" d="M196 467 L507 430 L507 416 L196 453 Z" fill="url(#bevelGrad)"/>
      <path id="Right Bevel" d="M828 467 L517 430 L517 416 L828 453 Z" fill="url(#bevelGrad)"/>
    </g>

    <!-- NAVIGATION LAYERS -->
    <g id="Navigation Layers">
      <!-- Wave 01 + shadow -->
      <path id="Wave 01 Shadow" d="M269 514 L512 498 L755 514 L512 530 Z" fill="#05080A" opacity="0.85"/>
      <path id="Wave 01" d="M269 507 L512 491 L755 507 L512 523 Z" fill="url(#waveMetal)"/>

      <!-- Wave 02 + shadow -->
      <path id="Wave 02 Shadow" d="M342 566 L512 552 L682 566 L512 580 Z" fill="#05080A" opacity="0.85"/>
      <path id="Wave 02" d="M342 559 L512 545 L682 559 L512 573 Z" fill="url(#waveMetal)"/>

      <!-- Wave 03 + shadow -->
      <path id="Wave 03 Shadow" d="M406 612 L512 600 L618 612 L512 624 Z" fill="#05080A" opacity="0.85"/>
      <path id="Wave 03" d="M406 605 L512 593 L618 605 L512 617 Z" fill="url(#waveMetal)"/>
    </g>

    <!-- DIRECTION MARK -->
    <g id="Direction Mark">
      <path id="Direction Diamond" d="M512 660 L577 690 L512 825 L447 690 Z" fill="url(#diamondMetal)"/>
    </g>

  </g>
</svg>
