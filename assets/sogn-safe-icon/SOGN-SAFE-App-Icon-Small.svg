<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" role="img" aria-label="SOGN SAFE app icon">
  <title>SOGN SAFE</title>
  <desc>Small-size variant: symbol scaled 1.22x so all five elements survive at 32px.</desc>

  <defs>
    <!-- Background: dark graphite, top-left brighter than bottom-right -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141B20" />
      <stop offset="0.55" stop-color="#0B1013" />
      <stop offset="1" stop-color="#06090B" />
    </linearGradient>

    <!-- Ship bow top-left face (lit) -->
    <linearGradient id="bowTL" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F9F6" />
      <stop offset="0.45" stop-color="#DCDFDA" />
      <stop offset="1" stop-color="#8E9396" />
    </linearGradient>

    <!-- Ship bow top-right face (mid) -->
    <linearGradient id="bowTR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9CA1A3" />
      <stop offset="1" stop-color="#4D5357" />
    </linearGradient>

    <!-- Ship bow bottom-left bevel -->
    <linearGradient id="bowBevelL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A8084" />
      <stop offset="1" stop-color="#3F4447" />
    </linearGradient>
    <!-- Ship bow bottom-right bevel -->
    <linearGradient id="bowBevelR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E6366" />
      <stop offset="1" stop-color="#2D3235" />
    </linearGradient>

    <!-- Chevron top face (lit) - used by every wave and the diamond -->
    <linearGradient id="chevTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F7F4" />
      <stop offset="0.5" stop-color="#D8D9D5" />
      <stop offset="1" stop-color="#7A8084" />
    </linearGradient>

    <!-- Chevron bottom face (shadow) -->
    <linearGradient id="chevBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8ADAF" />
      <stop offset="1" stop-color="#454A4D" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="url(#bg)" />

  <g transform="translate(512 500) scale(1.22) translate(-512 -500)">
    <path id="Ship Top Left" d="M 512 250 L 215 445 L 512 445 Z" fill="url(#bowTL)" />
    <path id="Ship Top Right" d="M 512 250 L 809 445 L 512 445 Z" fill="url(#bowTR)" />
    <path id="Ship Bevel Left" d="M 215 445 L 280 525 L 512 550 L 512 445 Z" fill="url(#bowBevelL)" />
    <path id="Ship Bevel Right" d="M 809 445 L 744 525 L 512 550 L 512 445 Z" fill="url(#bowBevelR)" />
    <line id="Ship Horizontal Seam" x1="215" y1="445" x2="809" y2="445" stroke="#0B1013" stroke-width="3" />
    <line id="Ship Vertical Seam" x1="512" y1="250" x2="512" y2="550" stroke="#0B1013" stroke-width="3" />
    <path id="Wave 1 Top" d="M 325 585 L 699 585 L 880 665 L 144 665 Z" fill="url(#chevTop)" />
    <path id="Wave 1 Bottom" d="M 144 665 L 880 665 L 512 735 Z" fill="url(#chevBottom)" />
    <line id="Wave 1 Seam" x1="144" y1="665" x2="880" y2="665" stroke="#0B1013" stroke-width="3" />
    <path id="Wave 2 Top" d="M 392 765 L 632 765 L 760 812 L 264 812 Z" fill="url(#chevTop)" />
    <path id="Wave 2 Bottom" d="M 264 812 L 760 812 L 512 855 Z" fill="url(#chevBottom)" />
    <line id="Wave 2 Seam" x1="264" y1="812" x2="760" y2="812" stroke="#0B1013" stroke-width="3" />
    <path id="Wave 3 Top" d="M 432 880 L 592 880 L 654 910 L 370 910 Z" fill="url(#chevTop)" />
    <path id="Wave 3 Bottom" d="M 370 910 L 654 910 L 512 940 Z" fill="url(#chevBottom)" />
    <line id="Wave 3 Seam" x1="370" y1="910" x2="654" y2="910" stroke="#0B1013" stroke-width="3" />
    <path id="Diamond Top" d="M 458 958 L 566 958 L 552 978 L 472 978 Z" fill="url(#chevTop)" />
    <path id="Diamond Bottom" d="M 472 978 L 552 978 L 512 998 Z" fill="url(#chevBottom)" />
    <line id="Diamond Seam" x1="472" y1="978" x2="552" y2="978" stroke="#0B1013" stroke-width="3" />
  </g>
</svg>
